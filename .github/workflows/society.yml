          SOCIETY_RUNTIME_JS
      - name: Validate bounded request
        run: |
          node --input-type=module -e '
            const u = new URL(process.env.WORLD_URL);
            if (u.protocol !== "https:" || u.username || u.password || u.pathname !== "/" || u.search || u.hash) throw Error("Use an HTTPS world origin");
            const n = Number(process.env.TURNS);
            if (!Number.isInteger(n) || n < 1 || n > 1200) throw Error("Turns must be 1..1200");
            if (!["mock", "llm"].includes(process.env.RUN_MODE)) throw Error("Invalid mode");
          '
      - name: Build runner
        run: |
          podman --version
          podman build -f Containerfile -t localhost/emergence-world-runner:ci .
      - name: Run isolated agent harness
        env:
          RUNNER_TOKEN: ${{ secrets.WORLD_RUNNER_TOKEN }}
        run: |
          test -n "$RUNNER_TOKEN" || { echo 'Set repository secret WORLD_RUNNER_TOKEN'; exit 1; }
          podman run --rm --init --name emergence-world-runner --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=256m --cpus=1 \
            --tmpfs=/tmp:rw,noexec,nosuid,size=16m --stop-timeout=25 \
            --volume=emergence-world-agent-state:/state \
